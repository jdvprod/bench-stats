# Netlify builds the app from GitHub. Set the production branch to `live` in Netlify so only releases deploy
# (free plan: 300 credits a month, 15 per production deploy). Release with: git push origin main:live
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker and the page must always be fresh so updates arrive.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
